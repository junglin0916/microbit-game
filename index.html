<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK 3D: Scout Expedition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a2332;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    /* HUD Overlays */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 38, 0.85);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .hud-title { font-weight: 700; color: #4db8ff; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    .bar-container { width: 220px; height: 14px; background: rgba(0,0,0,0.6); border-radius: 7px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }
    #stamina-bar { height: 100%; background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71); width: 100%; transition: width 0.1s linear; }
    
    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 38, 0.85);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; }
    .indicator.online { background: #2ecc71; box-shadow: 0 0 12px #2ecc71; }

    .controls-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 38, 0.85);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .nametag {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #4db8ff;
      pointer-events: none;
      transform: translate(-50%, -100%);
      white-space: nowrap;
    }
  </style>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<div id="labels-container" style="position:absolute; inset:0; pointer-events:none; z-index:5;"></div>

<div class="hud-panel">
  <div class="hud-title">Scout Stamina</div>
  <div class="bar-container">
    <div id="stamina-bar"></div>
  </div>
  <div class="hud-title" id="biome-label">Biome: Foothills</div>
  <div style="font-size: 18px; font-weight: 800; color: #f1c40f; margin-top: 4px;" id="alt-label">Altitude: 0m</div>
</div>

<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Connecting to Server...</span>
</div>

<div class="controls-hint">
  <b>[W/S]</b> Climb Up/Down &nbsp;|&nbsp; <b>[A/D]</b> Traverse Left/Right &nbsp;|&nbsp; <b>[SHIFT]</b> Sprint &nbsp;|&nbsp; <b>[SPACE]</b> Deploy Rope
</div>

<script>
  // --- 1. FIREBASE SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  let db = null;
  let playerRef = null;
  let playersRef = null;

  const myName = "Scout_" + Math.floor(Math.random()*899+100);
  const playerId = 'scout_' + Math.floor(Math.random() * 100000);
  let peerPlayers = {};
  let peerMeshes = {};
  let peerLabels = {};

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    playersRef = db.ref('peak_3d_expedition/players');
    playerRef = db.ref(`peak_3d_expedition/players/${playerId}`);

    playerRef.onDisconnect().remove();

    playersRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      peerPlayers = {};
      let count = 0;
      
      for (let id in data) {
        if (id !== playerId) {
          peerPlayers[id] = data[id];
          count++;
        }
      }

      const indicator = document.getElementById('net-status');
      const text = document.getElementById('net-text');
      if (count > 0) {
        indicator.classList.add('online');
        text.textContent = `Co-Op Expedition (${count + 1} Scouts Online)`;
      } else {
        indicator.classList.remove('online');
        text.textContent = `Solo Expedition (Waiting for Scout 2...)`;
      }
      
      syncPeer3DModels();
    });
  } catch(e) {
    console.error("Firebase error: ", e);
  }

  // --- 2. THREE.JS SCENE & LIGHTING SETUP ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a2332);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // BRIGHT LIGHTING - Guarantees everything is fully illuminated
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight1.position.set(50, 100, 50);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0x4db8ff, 0.4);
  dirLight2.position.set(-50, -50, -50);
  scene.add(dirLight2);

  // --- 3. 3D MOUNTAIN ENVIRONMENT ---
  const mountainGroup = new THREE.Group();
  scene.add(mountainGroup);

  // Main Mountain Cone
  const mGeo = new THREE.CylinderGeometry(20, 70, 500, 32, 32);
  const mMat = new THREE.MeshLambertMaterial({ color: 0x4a5568, flatShading: true });
  const mountain = new THREE.Mesh(mGeo, mMat);
  mountain.position.y = 200;
  mountainGroup.add(mountain);

  // 3D Ledges & Holds along the surface
  const ledgeGeo = new THREE.BoxGeometry(3, 0.8, 1.5);
  const ledgeMat = new THREE.MeshLambertMaterial({ color: 0x2d3748 });

  for (let y = -20; y < 450; y += 6 + Math.random() * 4) {
    const angle = (Math.random() - 0.5) * 1.8;
    const radius = 50 - (y * 0.05);
    const x = Math.sin(angle) * radius;
    const z = Math.cos(angle) * radius;

    const ledge = new THREE.Mesh(ledgeGeo, ledgeMat);
    ledge.position.set(x, y, z);
    ledge.lookAt(0, y, 0);
    mountainGroup.add(ledge);
  }

  // --- 4. 3D SCOUT AVATAR CREATION ---
  function createScoutModel(colorHex) {
    const group = new THREE.Group();

    // Body / Torso
    const torso = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.8, 0.9),
      new THREE.MeshLambertMaterial({ color: colorHex })
    );
    torso.position.y = 1;
    group.add(torso);

    // Head
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 12, 12),
      new THREE.MeshLambertMaterial({ color: 0xffccaa })
    );
    head.position.y = 2.2;
    group.add(head);

    // Backpack
    const pack = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.3, 0.7),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    pack.position.set(0, 1.1, -0.6);
    group.add(pack);

    // Limbs
    const limbMat = new THREE.MeshLambertMaterial({ color: colorHex });
    const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.2), limbMat);
    leftArm.position.set(-0.9, 1.4, 0.2);
    leftArm.rotation.z = 0.4;
    group.add(leftArm);

    const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.2), limbMat);
    rightArm.position.set(0.9, 1.4, 0.2);
    rightArm.rotation.z = -0.4;
    group.add(rightArm);

    return group;
  }

  const playerColor = Math.floor(Math.random() * 0xffffff);
  const myAvatar = createScoutModel(playerColor);
  scene.add(myAvatar);

  // Local State
  const player = {
    angle: 0,
    y: 0,
    radius: 50,
    stamina: 100,
    maxStamina: 100,
    ropePlaced: false
  };

  // --- 5. MULTIPLAYER SYNC & NAMETAGS ---
  function syncPeer3DModels() {
    const labelsDiv = document.getElementById('labels-container');

    for (let id in peerPlayers) {
      const data = peerPlayers[id];

      if (!peerMeshes[id]) {
        const pModel = createScoutModel(data.color || 0xe74c3c);
        scene.add(pModel);
        peerMeshes[id] = pModel;

        const tag = document.createElement('div');
        tag.className = 'nametag';
        tag.textContent = data.name || "Scout";
        labelsDiv.appendChild(tag);
        peerLabels[id] = tag;
      }

      peerMeshes[id].position.set(data.x, data.y, data.z);
      peerMeshes[id].rotation.y = data.rotY || 0;

      if (data.hasRope && !peerMeshes[id].ropeMesh) {
        const rGeo = new THREE.CylinderGeometry(0.15, 0.15, 30, 8);
        const rMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
        const rMesh = new THREE.Mesh(rGeo, rMat);
        rMesh.position.set(data.x, data.y - 15, data.z);
        scene.add(rMesh);
        peerMeshes[id].ropeMesh = rMesh;
      }
    }

    for (let id in peerMeshes) {
      if (!peerPlayers[id]) {
        scene.remove(peerMeshes[id]);
        if (peerMeshes[id].ropeMesh) scene.remove(peerMeshes[id].ropeMesh);
        delete peerMeshes[id];

        if (peerLabels[id]) {
          peerLabels[id].remove();
          delete peerLabels[id];
        }
      }
    }
  }

  function updateNametagPositions() {
    const tempV = new THREE.Vector3();
    for (let id in peerMeshes) {
      if (peerLabels[id]) {
        peerMeshes[id].getWorldPosition(tempV);
        tempV.y += 3.0;
        tempV.project(camera);

        const x = (tempV.x *  .5 + .5) * window.innerWidth;
        const y = (tempV.y * -.5 + .5) * window.innerHeight;

        peerLabels[id].style.left = `${x}px`;
        peerLabels[id].style.top = `${y}px`;
        peerLabels[id].style.display = tempV.z < 1 ? 'block' : 'none';
      }
    }
  }

  // --- 6. CONTROLS & PHYSICS ENGINE ---
  const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
  window.addEventListener('keydown', e => handleKey(e, true));
  window.addEventListener('keyup', e => handleKey(e, false));

  function handleKey(e, isDown) {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = isDown;
    if (k === 's') keys.s = isDown;
    if (k === 'a') keys.a = isDown;
    if (k === 'd') keys.d = isDown;
    if (e.key === 'Shift') keys.shift = isDown;
    if (e.key === ' ') keys.space = isDown;
  }

  // --- 7. ANIMATION & RENDER LOOP ---
  let clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    const speedY = keys.shift ? 16 : 8;
    const speedX = keys.shift ? 0.4 : 0.2;
    let moving = false;

    if (player.stamina > 0) {
      if (keys.w) { player.y += speedY * delta; moving = true; }
      if (keys.s) { player.y -= speedY * delta; moving = true; }
      if (keys.a) { player.angle -= speedX * delta; moving = true; }
      if (keys.d) { player.angle += speedX * delta; moving = true; }

      if (moving) {
        player.stamina = Math.max(0, player.stamina - (keys.shift ? 20 : 8) * delta);
      } else {
        player.stamina = Math.min(player.maxStamina, player.stamina + 30 * delta); // Recovery when resting
      }
    } else {
      // Exhausted gravity fall
      player.y -= 20 * delta;
      player.stamina = Math.min(player.maxStamina, player.stamina + 15 * delta);
    }

    // Mountain taper radius
    player.radius = Math.max(15, 50 - (player.y * 0.05));

    const posX = Math.sin(player.angle) * player.radius;
    const posZ = Math.cos(player.angle) * player.radius;

    myAvatar.position.set(posX, player.y, posZ);
    myAvatar.rotation.y = player.angle;

    // Deploy Rope
    if (keys.space && !player.ropePlaced) {
      player.ropePlaced = true;
      const rGeo = new THREE.CylinderGeometry(0.15, 0.15, 30, 8);
      const rMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
      const ropeMesh = new THREE.Mesh(rGeo, rMat);
      ropeMesh.position.set(posX, player.y - 15, posZ);
      scene.add(ropeMesh);
    }

    // Camera Placement (Third-Person dynamic follow)
    const camRadius = player.radius + 20;
    camera.position.set(
      Math.sin(player.angle) * camRadius,
      player.y + 5,
      Math.cos(player.angle) * camRadius
    );
    camera.lookAt(posX, player.y + 2, posZ);

    // Sync to Firebase
    if (playerRef) {
      playerRef.set({
        name: myName,
        x: posX,
        y: player.y,
        z: posZ,
        rotY: player.angle,
        color: playerColor,
        hasRope: player.ropePlaced,
        stamina: player.stamina,
        updated: Date.now()
      });
    }

    updateNametagPositions();

    // UI Updates
    document.getElementById('stamina-bar').style.width = `${(player.stamina / player.maxStamina) * 100}%`;
    const alt = Math.max(0, Math.floor(player.y * 8));
    document.getElementById('alt-label').textContent = `Altitude: ${alt}m`;

    if (alt > 1800) {
      document.getElementById('biome-label').textContent = "Biome: Volcanic Peak";
      scene.background.setHex(0x2c1108);
    } else if (alt > 900) {
      document.getElementById('biome-label').textContent = "Biome: Snowy Ridge";
      scene.background.setHex(0x111c2e);
    } else {
      document.getElementById('biome-label').textContent = "Biome: Foothills";
      scene.background.setHex(0x1a2332);
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
