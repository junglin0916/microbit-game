<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: Google Street View Shopping Expedition</title>
  
  <!-- Firebase Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?v=weekly"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; }
    
    #street-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* HUD Header */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      min-width: 260px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    .hud-title { font-weight: 700; color: #38bdf8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }

    .location-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      margin-right: 4px;
    }
    .location-btn:hover { background: #0369a1; }

    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .indicator.online { background: #22c55e; box-shadow: 0 0 12px #22c55e; }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="street-view"></div>

<!-- HUD -->
<div class="hud-panel">
  <div class="hud-title" id="player-id-tag">Player: Scout</div>
  <div class="hud-title" style="margin-top: 10px;">Shopping Districts</div>
  <div>
    <button class="location-btn" onclick="teleportTo(40.7580, -73.9855)">🛍️ Times Square NYC</button>
    <button class="location-btn" onclick="teleportTo(35.6595, 139.7004)">🗼 Shibuya Tokyo</button>
    <button class="location-btn" onclick="teleportTo(48.8606, 2.3376)">🎨 Paris Louvre</button>
  </div>
</div>

<!-- Connection Status -->
<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Connecting to server...</span>
</div>

<div class="controls-hint">
  <b>[CLICK & DRAG]</b> Look Around &nbsp;|&nbsp; <b>[ARROWS / CLICK ROADS]</b> Walk Street Together
</div>

<script>
  // --- 1. FIREBASE SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  const myRandomNumber = Math.floor(Math.random() * 899 + 100);
  const myName = "Scout #" + myRandomNumber;
  document.getElementById('player-id-tag').textContent = `You: ${myName}`;

  const playerId = 'scout_' + Math.floor(Math.random() * 100000);
  let db, playerRef, playersRef;
  let isUpdatingFromNetwork = false;

  // Initial Location: Times Square, New York
  let currentLat = 40.7580;
  let currentLng = -73.9855;
  let currentPov = { heading: 0, pitch: 0 };

  // --- 2. INITIALIZE GOOGLE STREET VIEW ---
  let panorama;

  function initStreetView() {
    panorama = new google.maps.StreetViewPanorama(
      document.getElementById('street-view'),
      {
        position: { lat: currentLat, lng: currentLng },
        pov: currentPov,
        zoom: 1,
        addressControl: true,
        showRoadLabels: true,
        motionTracking: false,
        motionTrackingControl: false
      }
    );

    // Sync Movement (When user steps down the street)
    panorama.addListener('position_changed', () => {
      if (isUpdatingFromNetwork) return;
      const pos = panorama.getPosition();
      currentLat = pos.lat();
      currentLng = pos.lng();
      pushToFirebase();
    });

    // Sync Camera Rotation (When user turns camera)
    panorama.addListener('pov_changed', () => {
      if (isUpdatingFromNetwork) return;
      currentPov = panorama.getPov();
      pushToFirebase();
    });
  }

  window.onload = () => {
    initStreetView();
    initFirebase();
  };

  // --- 3. FIREBASE MULTIPLAYER SYNC ---
  function initFirebase() {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      playersRef = db.ref('street_shopping/players');
      playerRef = db.ref(`street_shopping/players/${playerId}`);
      playerRef.onDisconnect().remove();

      playersRef.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        let count = 0;
        let peerData = null;

        for (let id in data) {
          if (id !== playerId) {
            peerData = data[id];
            count++;
          }
        }

        document.getElementById('net-status').className = count > 0 ? 'indicator online' : 'indicator';
        document.getElementById('net-text').textContent = count > 0 ? `Shopping with Partner (${count + 1} Online)` : `Waiting for Player 2...`;

        // Follow partner's location if they move
        if (peerData && peerData.lat && peerData.lng) {
          isUpdatingFromNetwork = true;
          panorama.setPosition({ lat: peerData.lat, lng: peerData.lng });
          if (peerData.pov) {
            panorama.setPov(peerData.pov);
          }
          setTimeout(() => { isUpdatingFromNetwork = false; }, 300);
        }
      });
    } catch(e) { console.error("Firebase err:", e); }
  }

  function pushToFirebase() {
    if (playerRef) {
      playerRef.set({
        name: myName,
        lat: currentLat,
        lng: currentLng,
        pov: currentPov,
        updated: Date.now()
      });
    }
  }

  // Quick Teleport Buttons
  function teleportTo(lat, lng) {
    isUpdatingFromNetwork = false;
    currentLat = lat;
    currentLng = lng;
    panorama.setPosition({ lat: lat, lng: lng });
    pushToFirebase();
  }
</script>
</body>
</html>
