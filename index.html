<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: YouTube Co-Op Star Rush</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; }
    
    #game-stage {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* 1. YouTube Center Video Background */
    #yt-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

    /* Game Canvas */
    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* HUD Header */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 10;
      min-width: 250px;
    }

    .hud-title { font-weight: 700; color: #38bdf8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }

    .btn-action {
      background: #0284c7; color: #fff; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; margin-top: 6px;
      margin-right: 4px;
    }
    .btn-action:hover { background: #0369a1; }

    /* 3-Minute Timer Display */
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      padding: 10px 28px;
      border-radius: 30px;
      border: 2px solid #38bdf8;
      backdrop-filter: blur(10px);
      font-size: 20px;
      font-weight: 800;
      color: #fde047;
      z-index: 10;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .indicator.online { background: #22c55e; box-shadow: 0 0 12px #22c55e; }

    /* Name Modal & Winner Screen */
    #name-modal, #game-over-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    #game-over-modal { display: none; }

    .modal-box {
      background: #0f172a;
      border: 2px solid #38bdf8;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
      max-width: 440px;
      width: 90%;
    }
    .modal-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid #38bdf8; background: #1e293b; color: #fff; font-size: 16px; text-align: center;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- YouTube Background -->
  <iframe id="yt-bg" 
    src="https://www.youtube.com/embed/tAwJE-1z6z0?autoplay=1&mute=1&controls=0&loop=1&playlist=tAwJE-1z6z0&enablejsapi=1" 
    allow="autoplay" 
    frameborder="0">
  </iframe>

  <!-- Game Canvas -->
  <canvas id="canvas-overlay"></canvas>
</div>

<!-- 3-Minute Timer -->
<div class="timer-badge">⏱️ <span id="timer-val">03:00</span></div>

<!-- Player HUD -->
<div class="hud-panel">
  <div class="hud-title" id="player-tag">Player: Guest</div>
  <div class="hud-title" style="margin-top: 6px;">Score: <span id="score-val" style="color:#fde047">0</span></div>
  <button class="btn-action" onclick="toggleMusic()">🎵 Music On/Off</button>
  <button class="btn-action" onclick="connectMicrobit()">📲 Connect Micro:bit</button>
  <div id="bit-status" style="font-size: 11px; color: #94a3b8; margin-top: 6px;">DDR Pad / Keyboard Ready</div>
</div>

<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Checking server...</span>
</div>

<div class="controls-hint">
  <b>[W]</b> Step Up &nbsp;|&nbsp; <b>[S]</b> Bounce Jump &nbsp;|&nbsp; <b>[A / D or Micro:bit Tilt]</b> Move Left / Right
</div>

<!-- Name Input Modal -->
<div id="name-modal">
  <div class="modal-box">
    <h2 style="color: #38bdf8;">🎮 Join Star Rush Arcade</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">3-Minute Co-Op Challenge</p>
    <input type="text" id="player-name-input" placeholder="Enter Your Name / Student ID" maxlength="20">
    <button class="btn-action" style="width: 100%; padding: 12px; font-size: 16px; margin-top:10px;" onclick="startGame()">Start Game & Music</button>
  </div>
</div>

<!-- Game Over / Winner Modal -->
<div id="game-over-modal">
  <div class="modal-box">
    <h1 style="color: #fde047; font-size: 32px;">🏆 TIME'S UP!</h1>
    <h2 id="winner-announcement" style="color: #38bdf8; margin: 15px 0;">Calculating Scores...</h2>
    <p id="final-stats" style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;"></p>
    <button class="btn-action" style="width: 100%; padding: 12px; font-size: 16px;" onclick="window.location.reload()">Play Again</button>
  </div>
</div>

<script>
  // --- PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ---
  const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytkAaHgQ1g_zXy625h_TGENTV6_OBUyw7GRiEXtH0tyNuf8k06R3a3u4RcahzVWi7B/exec";

  // --- NATIVE BROWSER AUDIO SYNTHESIZER (SYNTH MUSIC) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let musicInterval = null;
  let isMusicPlaying = false;

  const melNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C Major Scale
  let noteIdx = 0;

  function startSynthMusic() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (isMusicPlaying) return;
    isMusicPlaying = true;

    musicInterval = setInterval(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'triangle';
      const freq = melNotes[noteIdx % melNotes.length];
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
      noteIdx = (noteIdx + Math.floor(Math.random() * 3 + 1)) % melNotes.length;
    }, 250);
  }

  function toggleMusic() {
    if (isMusicPlaying) {
      clearInterval(musicInterval);
      isMusicPlaying = false;
    } else {
      startSynthMusic();
    }
  }

  function playCollectSFX() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  // --- FIREBASE MULTIPLAYER SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  let db, playerRef, playersRef;
  let myPlayerSlot = 1;
  let myName = "";
  let peerPlayers = {};

  const playerId = 'scout_' + Math.floor(Math.random() * 100000);

  // Canvas
  const canvas = document.getElementById('canvas-overlay');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Local State
  const myState = {
    x: window.innerWidth * 0.4,
    y: window.innerHeight * 0.85,
    baseY: window.innerHeight * 0.85,
    targetY: window.innerHeight * 0.85,
    score: 0,
    prizes: 0,
    isJumping: false,
    reboundVelocity: 0
  };

  // 3-Minute Timer Variables
  let timeLeft = 180; // 3 minutes in seconds
  let timerInterval = null;
  let isGameOver = false;

  let stars = [];

  function spawnStar() {
    if (isGameOver) return;
    const isLeft = Math.random() < 0.5;
    const xPos = isLeft ? Math.random() * (canvas.width * 0.32) : canvas.width * 0.68 + Math.random() * (canvas.width * 0.32);
    stars.push({
      x: xPos,
      y: -20,
      speed: 3 + Math.random() * 4,
      symbol: Math.random() < 0.3 ? '🎁' : '⭐'
    });
  }
  setInterval(spawnStar, 1000);

  // --- START GAME & TIMER ---
  function startGame() {
    const input = document.getElementById('player-name-input').value.trim();
    if (!input) { alert("Please enter your name!"); return; }
    myName = input;
    document.getElementById('player-tag').textContent = `You: ${myName}`;

    startSynthMusic();
    document.getElementById('name-modal').style.display = 'none';

    initFirebase();
    startTimer();
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeLeft--;
      const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const secs = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer-val').textContent = `${mins}:${secs}`;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    isGameOver = true;
    let peerName = "Player 2";
    let peerScore = 0;

    for (let id in peerPlayers) {
      peerName = peerPlayers[id].name || "Player 2";
      peerScore = peerPlayers[id].score || 0;
    }

    let winnerText = "";
    if (myState.score > peerScore) {
      winnerText = `🎉 ${myName} WINS!`;
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
    } else if (peerScore > myState.score) {
      winnerText = `👑 ${peerName} WINS!`;
    } else {
      winnerText = "🤝 IT'S A TIE!";
    }

    document.getElementById('winner-announcement').textContent = winnerText;
    document.getElementById('final-stats').innerHTML = 
      `<b>${myName}:</b> ${myState.score} pts<br><b>${peerName}:</b> ${peerScore} pts`;

    document.getElementById('game-over-modal').style.display = 'flex';

    saveScoreToGoogleSheet(myState.score > peerScore ? "WINNER" : "COMPLETED");
  }

  function initFirebase() {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      playersRef = db.ref('yt_star_expedition/players');

      playersRef.once('value', (snapshot) => {
        const data = snapshot.val() || {};
        const activeIds = Object.keys(data);

        if (activeIds.length >= 2) {
          alert("Room Full! Max 2 Players currently connected.");
          window.location.reload();
          return;
        }

        myPlayerSlot = activeIds.length === 0 ? 1 : 2;
        myState.x = myPlayerSlot === 1 ? canvas.width * 0.4 : canvas.width * 0.6;

        playerRef = db.ref(`yt_star_expedition/players/${playerId}`);
        playerRef.onDisconnect().remove();

        playersRef.on('value', (snap) => {
          const allData = snap.val() || {};
          peerPlayers = {};
          let count = 0;
          for (let id in allData) {
            if (id !== playerId) {
              peerPlayers[id] = allData[id];
              count++;
            }
          }
          document.getElementById('net-status').className = count > 0 ? 'indicator online' : 'indicator';
          document.getElementById('net-text').textContent = count > 0 ? `2 Players Online` : `Waiting for Player 2...`;
        });

        requestAnimationFrame(gameLoop);
      });
    } catch(e) { console.error("Firebase err:", e); }
  }

  // --- KEYBOARD CONTROLS ---
  window.addEventListener('keydown', (e) => {
    if (isGameOver) return;
    const k = e.key.toLowerCase();

    if (k === 'w' || e.key === 'ArrowUp') {
      myState.baseY = Math.max(canvas.height * 0.55, myState.baseY - 20);
    }
    if (k === 's' || e.key === 'ArrowDown') {
      if (!myState.isJumping) {
        myState.isJumping = true;
        myState.reboundVelocity = -22;
      }
    }
    if (k === 'a' || e.key === 'ArrowLeft') {
      myState.x = Math.max(40, myState.x - 35);
    }
    if (k === 'd' || e.key === 'ArrowRight') {
      myState.x = Math.min(canvas.width - 40, myState.x + 35);
    }
  });

  // --- MICRO:BIT TILT CONTROLS ---
  async function connectMicrobit() {
    const statusDiv = document.getElementById('bit-status');
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: ['e95d0753-251d-470a-a062-fa1922dfa9a8']
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('e95d0753-251d-470a-a062-fa1922dfa9a8');
      const char = await service.getCharacteristic('e95dca4b-251d-470a-a062-fa1922dfa9a8');

      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', (e) => {
        if (isGameOver) return;
        const view = e.target.value;
        const xTilt = view.getInt16(0, true);

        if (xTilt < -300) myState.x = Math.max(40, myState.x - 12);
        else if (xTilt > 300) myState.x = Math.min(canvas.width - 40, myState.x + 12);
      });

      statusDiv.style.color = "#22c55e";
      statusDiv.textContent = "Micro:bit Tilt Active!";
    } catch(err) {
      statusDiv.style.color = "#f59e0b";
      statusDiv.textContent = "DDR Pad / Keyboard Active";
    }
  }

  // --- GAME LOOP ---
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (myState.isJumping) {
      myState.targetY += myState.reboundVelocity;
      myState.reboundVelocity += 1.2;

      if (myState.targetY >= myState.baseY) {
        myState.targetY = myState.baseY;
        myState.isJumping = false;
        myState.baseY = Math.min(canvas.height * 0.88, myState.baseY + 15);
      }
    } else {
      myState.targetY = myState.baseY;
    }

    // Render Stars
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.speed;

      ctx.font = '26px sans-serif';
      ctx.fillText(s.symbol, s.x, s.y);

      const dist = Math.hypot(myState.x - s.x, myState.targetY - s.y);
      if (dist < 45) {
        playCollectSFX();
        myState.prizes++;
        myState.score += (s.symbol === '🎁' ? 50 : 20);
        document.getElementById('score-val').textContent = myState.score;
        confetti({ particleCount: 15, spread: 40, origin: { x: myState.x / canvas.width, y: myState.targetY / canvas.height } });
        stars.splice(i, 1);
        saveScoreToGoogleSheet("In Game");
      } else if (s.y > canvas.height) {
        stars.splice(i, 1);
      }
    }

    // Draw Peer
    for (let id in peerPlayers) {
      const p = peerPlayers[id];
      drawAvatar(p.x, p.y, p.name, false);
    }

    // Draw Local Player
    drawAvatar(myState.x, myState.targetY, myName + " (You)", true);

    if (playerRef) {
      playerRef.set({
        name: myName,
        x: myState.x,
        y: myState.targetY,
        score: myState.score,
        prizes: myState.prizes,
        updated: Date.now()
      });
    }

    if (!isGameOver) requestAnimationFrame(gameLoop);
  }

  function drawAvatar(x, y, nameStr, isMe) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y + 10, 30, 0, Math.PI * 2);
    ctx.fillStyle = isMe ? 'rgba(56, 189, 248, 0.4)' : 'rgba(250, 204, 21, 0.4)';
    ctx.fill();

    ctx.fillStyle = isMe ? '#0284c7' : '#eab308';
    ctx.fillRect(x - 20, y - 30, 40, 40);

    ctx.beginPath();
    ctx.arc(x, y - 45, 18, 0, Math.PI * 2);
    ctx.fillStyle = '#fde047';
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(nameStr, x, y - 70);
    ctx.restore();
  }

  function saveScoreToGoogleSheet(resultStatus) {
    if (!GOOGLE_SHEET_SCRIPT_URL || GOOGLE_SHEET_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;

    fetch(GOOGLE_SHEET_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        playerName: myName,
        score: myState.score,
        prizes: myState.prizes,
        result: resultStatus
      })
    }).catch(err => console.error("Sheet Error:", err));
  }
</script>
</body>
</html>
