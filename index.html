<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: Google Earth Micro:bit Expedition</title>
  
  <!-- Cesium 3D Globe Engine -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- Firebase Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a2332; color: #fff; }
    
    #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* UI Panels */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 16, 26, 0.88);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      min-width: 250px;
    }
    
    .hud-title { font-weight: 700; color: #4db8ff; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    .bar-container { width: 100%; height: 14px; background: rgba(0,0,0,0.6); border-radius: 7px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }
    #hp-bar { height: 100%; background: linear-gradient(90deg, #e74c3c, #2ecc71); width: 100%; transition: width 0.2s ease; }

    .btn-action {
      background: #2ecc71;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action:hover { background: #27ae60; }

    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(10, 16, 26, 0.88);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; }
    .indicator.online { background: #2ecc71; box-shadow: 0 0 12px #2ecc71; }

    /* YouTube Mood Player PIP */
    #yt-mood-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 280px;
      height: 158px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      background: #000;
    }
    #yt-mood-container iframe { width: 100%; height: 100%; border: none; }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 16, 26, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<!-- HUD -->
<div class="hud-panel">
  <div class="hud-title">Explorer Health</div>
  <div class="bar-container"><div id="hp-bar"></div></div>
  
  <div class="hud-title" id="location-label">Location: Mount Everest</div>
  
  <div style="margin-top: 10px; display: flex; gap: 8px;">
    <button class="btn-action" onclick="connectMicrobit()">⚔️ Connect Micro:bit</button>
  </div>
  <div id="bit-status" style="font-size: 11px; color: #aaa; margin-top: 6px;">Micro:bit: Optional (WASD + Space ready!)</div>
</div>

<!-- Multiplayer Status -->
<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Connecting...</span>
</div>

<!-- Picture-in-Picture Mood YouTube Video -->
<div id="yt-mood-container">
  <iframe src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&loop=1&playlist=jfKfPfyJRdk" allow="autoplay"></iframe>
</div>

<div class="controls-hint">
  <b>[WASD]</b> Walk Map &nbsp;|&nbsp; <b>[SPACE]</b> Sword Slash &nbsp;|&nbsp; <b>[SWING MICRO:BIT]</b> Motion Slash
</div>

<script>
  // --- 1. FIREBASE MULTIPLAYER SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  const playerId = 'scout_' + Math.floor(Math.random() * 100000);
  let db, playerRef, playersRef;
  let peerPlayers = {}, peerEntities = {};

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    playersRef = db.ref('earth_expedition/players');
    playerRef = db.ref(`earth_expedition/players/${playerId}`);
    playerRef.onDisconnect().remove();

    playersRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      peerPlayers = {};
      let count = 0;
      for (let id in data) {
        if (id !== playerId) {
          peerPlayers[id] = data[id];
          count++;
        }
      }
      document.getElementById('net-status').className = count > 0 ? 'indicator online' : 'indicator';
      document.getElementById('net-text').textContent = count > 0 ? `Co-Op Linked (${count + 1} Explorers)` : `Waiting for Player 2...`;
      syncPeerEntities();
    });
  } catch(e) { console.error("Firebase fail:", e); }

  // --- 2. BRIGHT GOOGLE EARTH / CESIUM GLOBE INITIALIZATION ---
  const LOCATIONS = [
    { name: "Mount Everest", lat: 27.9881, lon: 86.9250, alt: 8848 },
    { name: "Grand Canyon", lat: 36.1069, lon: -112.1129, alt: 2200 },
    { name: "Mount Fuji", lat: 35.3606, lon: 138.7274, alt: 3776 },
    { name: "Yosemite El Capitan", lat: 37.7341, lon: -119.6375, alt: 2307 }
  ];
  const startLoc = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
  document.getElementById('location-label').textContent = `Location: ${startLoc.name}`;

  // Use free OpenStreetMap imagery so it ALWAYS renders brightly without API keys
  const osmImagery = new Cesium.OpenStreetMapImageryProvider({
    url: 'https://tile.openstreetmap.org/'
  });

  const viewer = new Cesium.Viewer('cesiumContainer', {
    imageryProvider: osmImagery,
    baseLayerPicker: false,
    animation: false,
    timeline: false,
    fullscreenButton: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false
  });

  // FORCE BRIGHT DAYLIGHT ALWAYS (Disable shadows/night darkness)
  viewer.scene.globe.enableLighting = false;
  viewer.scene.highDynamicRange = false;

  // Local Player State
  const playerState = {
    lat: startLoc.lat,
    lon: startLoc.lon,
    alt: startLoc.alt,
    hp: 100
  };

  // Local Player 3D Marker
  const playerEntity = viewer.entities.add({
    name: 'You',
    position: Cesium.Cartesian3.fromDegrees(playerState.lon, playerState.lat, playerState.alt + 10),
    point: { pixelSize: 18, color: Cesium.Color.DEEPSKYBLUE, outlineColor: Cesium.Color.WHITE, outlineWidth: 3 },
    label: { text: 'Scout 1 (You)', font: 'bold 14px sans-serif', fillColor: Cesium.Color.WHITE, pixelOffset: new Cesium.Cartesian2(0, -28) }
  });

  // Zoom camera directly to player
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(playerState.lon, playerState.lat - 0.002, playerState.alt + 250),
    orientation: { pitch: Cesium.Math.toRadians(-35) }
  });

  // --- 3. WEB AUDIO SFX ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'slash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
  }

  // --- 4. MONSTER SYSTEM ---
  let activeMonster = null;
  function spawnMonster() {
    if (activeMonster) return;
    const mLat = playerState.lat + (Math.random() - 0.5) * 0.0012;
    const mLon = playerState.lon + (Math.random() - 0.5) * 0.0012;

    const monsterEntity = viewer.entities.add({
      name: 'Monster',
      position: Cesium.Cartesian3.fromDegrees(mLon, mLat, playerState.alt + 10),
      point: { pixelSize: 22, color: Cesium.Color.RED, outlineColor: Cesium.Color.YELLOW, outlineWidth: 3 },
      label: { text: '⚠️ MONSTER', font: 'bold 13px sans-serif', fillColor: Cesium.Color.RED, pixelOffset: new Cesium.Cartesian2(0, -28) }
    });

    activeMonster = { entity: monsterEntity, lat: mLat, lon: mLon };
  }
  setInterval(spawnMonster, 6000);

  function attackWithSword() {
    playSound('slash');
    if (activeMonster) {
      const dLat = Math.abs(playerState.lat - activeMonster.lat);
      const dLon = Math.abs(playerState.lon - activeMonster.lon);
      if (dLat < 0.0018 && dLon < 0.0018) {
        viewer.entities.remove(activeMonster.entity);
        activeMonster = null;
        playSound('hit');
      }
    }
  }

  // --- 5. MICRO:BIT BLUETOOTH ---
  async function connectMicrobit() {
    const statusDiv = document.getElementById('bit-status');
    try {
      statusDiv.textContent = "Searching for micro:bit...";
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: ['e95d0753-251d-470a-a062-fa1922dfa9a8']
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('e95d0753-251d-470a-a062-fa1922dfa9a8');
      const char = await service.getCharacteristic('e95dca4b-251d-470a-a062-fa1922dfa9a8');

      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', (e) => {
        const view = e.target.value;
        const x = view.getInt16(0, true);
        const y = view.getInt16(2, true);
        const z = view.getInt16(4, true);

        const accel = Math.sqrt(x*x + y*y + z*z);
        if (accel > 1800) attackWithSword();
      });

      statusDiv.style.color = "#2ecc71";
      statusDiv.textContent = "Micro:bit Sword: CONNECTED";
    } catch (err) {
      statusDiv.style.color = "#f1c40f";
      statusDiv.textContent = "Keyboard mode active [SPACE to attack]";
    }
  }

  // --- 6. MULTIPLAYER PEER SYNC ---
  function syncPeerEntities() {
    for (let id in peerPlayers) {
      const p = peerPlayers[id];
      if (!peerEntities[id]) {
        peerEntities[id] = viewer.entities.add({
          name: p.name || 'Scout 2',
          position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.alt + 10),
          point: { pixelSize: 18, color: Cesium.Color.YELLOW, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 },
          label: { text: 'Scout 2', font: 'bold 14px sans-serif', fillColor: Cesium.Color.YELLOW, pixelOffset: new Cesium.Cartesian2(0, -28) }
        });
      } else {
        peerEntities[id].position = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.alt + 10);
      }
    }

    for (let id in peerEntities) {
      if (!peerPlayers[id]) {
        viewer.entities.remove(peerEntities[id]);
        delete peerEntities[id];
      }
    }
  }

  // --- 7. CONTROLS & MAIN LOOP ---
  const keys = { w: false, a: false, s: false, d: false };
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = true;
    if (k === 's') keys.s = true;
    if (k === 'a') keys.a = true;
    if (k === 'd') keys.d = true;
    if (e.key === ' ') attackWithSword();
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = false;
    if (k === 's') keys.s = false;
    if (k === 'a') keys.a = false;
    if (k === 'd') keys.d = false;
  });

  const step = 0.00015;
  setInterval(() => {
    let moved = false;
    if (keys.w) { playerState.lat += step; moved = true; }
    if (keys.s) { playerState.lat -= step; moved = true; }
    if (keys.a) { playerState.lon -= step; moved = true; }
    if (keys.d) { playerState.lon += step; moved = true; }

    if (moved) {
      playerEntity.position = Cesium.Cartesian3.fromDegrees(playerState.lon, playerState.lat, playerState.alt + 10);

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(playerState.lon, playerState.lat - 0.002, playerState.alt + 250),
        orientation: { pitch: Cesium.Math.toRadians(-35) }
      });
    }

    if (activeMonster) {
      const dLat = Math.abs(playerState.lat - activeMonster.lat);
      const dLon = Math.abs(playerState.lon - activeMonster.lon);
      if (dLat < 0.0003 && dLon < 0.0003) {
        playerState.hp = Math.max(0, playerState.hp - 0.5);
        document.getElementById('hp-bar').style.width = playerState.hp + '%';
      }
    }

    if (playerRef) {
      playerRef.set({
        lat: playerState.lat,
        lon: playerState.lon,
        alt: playerState.alt,
        hp: playerState.hp,
        updated: Date.now()
      });
    }
  }, 30);
</script>
</body>
</html>
