<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: YouTube Co-Op Star Rush</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; }
    
    #game-stage {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* 1. Youtube Center Video Background */
    #yt-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

    /* Game Canvas for Avatars & Raining Stars */
    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* HUD Controls & Info */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 10;
      min-width: 250px;
    }

    .hud-title { font-weight: 700; color: #38bdf8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }

    .btn-action {
      background: #0284c7; color: #fff; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; margin-top: 6px;
    }
    .btn-action:hover { background: #0369a1; }

    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .indicator.online { background: #22c55e; box-shadow: 0 0 12px #22c55e; }

    /* Name Modal Overlay */
    #name-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .modal-box {
      background: #0f172a;
      border: 2px solid #38bdf8;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
      max-width: 400px;
      width: 90%;
    }
    .modal-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid #38bdf8; background: #1e293b; color: #fff; font-size: 16px; text-align: center;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- 1. Embedded YouTube Video Background (Muted) -->
  <iframe id="yt-bg" 
    src="https://www.youtube.com/embed/tAwJE-1z6z0?autoplay=1&mute=1&controls=0&loop=1&playlist=tAwJE-1z6z0&enablejsapi=1" 
    allow="autoplay" 
    frameborder="0">
  </iframe>

  <!-- 2. Interactive Canvas for Players & Falling Stars -->
  <canvas id="canvas-overlay"></canvas>
</div>

<!-- Pixabay Royalty Free Background Audio -->
<audio id="bg-audio" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a731ef.mp3?filename=game-arcade-110250.mp3"></audio>

<!-- Player HUD -->
<div class="hud-panel">
  <div class="hud-title" id="player-tag">Player: Guest</div>
  <div class="hud-title" style="margin-top: 6px;">Score: <span id="score-val" style="color:#fde047">0</span></div>
  <button class="btn-action" onclick="connectMicrobit()">📲 Connect Micro:bit</button>
  <div id="bit-status" style="font-size: 11px; color: #94a3b8; margin-top: 4px;">DDR Pad / WASD Active</div>
</div>

<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Checking server...</span>
</div>

<div class="controls-hint">
  <b>[W]</b> Step Forward &nbsp;|&nbsp; <b>[S]</b> Bounce Jump &nbsp;|&nbsp; <b>[A / D]</b> Grab Left / Right Stars
</div>

<!-- Name Registration Modal -->
<div id="name-modal">
  <div class="modal-box">
    <h2 style="color: #38bdf8;">🎮 Join Arcade Expedition</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">Enter your name to play & record on the Google Sheet Scoreboard!</p>
    <input type="text" id="player-name-input" placeholder="Enter Your Name / Student ID" maxlength="20">
    <button class="btn-action" style="width: 100%; padding: 12px; font-size: 16px;" onclick="startGame()">Start Game</button>
  </div>
</div>

<script>
  // --- PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ---
  const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytkAaHgQ1g_zXy625h_TGENTV6_OBUyw7GRiEXtH0tyNuf8k06R3a3u4RcahzVWi7B/exec";

  // --- FIREBASE MULTIPLAYER SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  let db, playerRef, playersRef;
  let myPlayerSlot = 1; // Slot 1 or 2
  let myName = "";
  let myScore = 0;
  let myPrizes = 0;
  let peerPlayers = {};

  const playerId = 'scout_' + Math.floor(Math.random() * 100000);

  // Canvas Setup
  const canvas = document.getElementById('canvas-overlay');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Local Player State
  const myState = {
    x: window.innerWidth * 0.4,
    y: window.innerHeight * 0.85,
    baseY: window.innerHeight * 0.85,
    targetY: window.innerHeight * 0.85,
    score: 0,
    prizes: 0,
    isJumping: false,
    reboundVelocity: 0
  };

  // Falling Stars array (Left & Right sides)
  let stars = [];

  function spawnStar() {
    const isLeft = Math.random() < 0.5;
    const xPos = isLeft ? Math.random() * (canvas.width * 0.3) : canvas.width * 0.7 + Math.random() * (canvas.width * 0.3);
    stars.push({
      x: xPos,
      y: -20,
      speed: 3 + Math.random() * 4,
      radius: 14,
      symbol: Math.random() < 0.3 ? '🎁' : '⭐'
    });
  }
  setInterval(spawnStar, 1200);

  // --- START GAME & 2-PLAYER MAX ROOM GUARD ---
  function startGame() {
    const input = document.getElementById('player-name-input').value.trim();
    if (!input) { alert("Please enter your name!"); return; }
    myName = input;
    document.getElementById('player-tag').textContent = `You: ${myName}`;

    // Start Audio
    const audio = document.getElementById('bg-audio');
    audio.play().catch(e => console.log("Audio waiting for touch"));

    document.getElementById('name-modal').style.display = 'none';

    initFirebase();
  }

  function initFirebase() {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      playersRef = db.ref('yt_star_expedition/players');

      // Check player count (Strictly Max 2 Players)
      playersRef.once('value', (snapshot) => {
        const data = snapshot.val() || {};
        const activeIds = Object.keys(data);

        if (activeIds.length >= 2) {
          alert("Room Full! Max 2 Players currently connected. Please try again in a moment.");
          window.location.reload();
          return;
        }

        myPlayerSlot = activeIds.length === 0 ? 1 : 2;
        myState.x = myPlayerSlot === 1 ? canvas.width * 0.4 : canvas.width * 0.6;

        playerRef = db.ref(`yt_star_expedition/players/${playerId}`);
        playerRef.onDisconnect().remove();

        // Listen for player updates
        playersRef.on('value', (snap) => {
          const allData = snap.val() || {};
          peerPlayers = {};
          let count = 0;
          for (let id in allData) {
            if (id !== playerId) {
              peerPlayers[id] = allData[id];
              count++;
            }
          }
          document.getElementById('net-status').className = count > 0 ? 'indicator online' : 'indicator';
          document.getElementById('net-text').textContent = count > 0 ? `2 Players Connected` : `Waiting for Player 2...`;
        });

        // Run game loop
        requestAnimationFrame(gameLoop);
      });
    } catch(e) { console.error("Firebase error:", e); }
  }

  // --- CONTROLS & REBOUND JUMP MECHANIC ---
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();

    // W: Steps upward slightly
    if (k === 'w' || e.key === 'ArrowUp') {
      myState.baseY = Math.max(canvas.height * 0.55, myState.baseY - 18);
    }

    // S: Fun Rebound Jump Mechanic (Springs forward then setbacks)
    if (k === 's' || e.key === 'ArrowDown') {
      if (!myState.isJumping) {
        myState.isJumping = true;
        myState.reboundVelocity = -22; // Jump leap
      }
    }

    // A: Step Left
    if (k === 'a' || e.key === 'ArrowLeft') {
      myState.x = Math.max(40, myState.x - 30);
    }

    // D: Step Right
    if (k === 'd' || e.key === 'ArrowRight') {
      myState.x = Math.min(canvas.width - 40, myState.x + 30);
    }
  });

  // Micro:bit Bluetooth Motion Support
  async function connectMicrobit() {
    const statusDiv = document.getElementById('bit-status');
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: ['e95d0753-251d-470a-a062-fa1922dfa9a8']
      });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('e95d0753-251d-470a-a062-fa1922dfa9a8');
      const char = await service.getCharacteristic('e95dca4b-251d-470a-a062-fa1922dfa9a8');

      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', (e) => {
        const view = e.target.value;
        const x = view.getInt16(0, true);
        const y = view.getInt16(2, true);

        // Shake detection causes swing grab
        if (Math.abs(x) > 1500) {
          myState.x += (x > 0 ? 40 : -40);
        }
      });
      statusDiv.style.color = "#22c55e";
      statusDiv.textContent = "Micro:bit Motion Connected";
    } catch(err) {
      statusDiv.textContent = "DDR Pad / Keyboard Ready";
    }
  }

  // --- GAME LOOP & RENDERING ---
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Apply Rebound Physics for 'S' Jump
    if (myState.isJumping) {
      myState.targetY += myState.reboundVelocity;
      myState.reboundVelocity += 1.2; // Gravity

      // Rebound Setback logic
      if (myState.targetY >= myState.baseY) {
        myState.targetY = myState.baseY;
        myState.isJumping = false;
        // Minor backward bounce setback
        myState.baseY = Math.min(canvas.height * 0.88, myState.baseY + 12);
      }
    } else {
      myState.targetY = myState.baseY;
    }

    // Render & Update Falling Stars
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.speed;

      ctx.font = '24px sans-serif';
      ctx.fillText(s.symbol, s.x, s.y);

      // Collision Detection with Player
      const dist = Math.hypot(myState.x - s.x, myState.targetY - s.y);
      if (dist < 45) {
        myState.prizes++;
        myState.score += (s.symbol === '🎁' ? 50 : 20);
        document.getElementById('score-val').textContent = myState.score;
        confetti({ particleCount: 15, spread: 40, origin: { x: myState.x / canvas.width, y: myState.targetY / canvas.height } });
        stars.splice(i, 1);
        saveScoreToGoogleSheet("In Game Update");
      } else if (s.y > canvas.height) {
        stars.splice(i, 1);
      }
    }

    // Draw Peer Players (Player 2)
    for (let id in peerPlayers) {
      const p = peerPlayers[id];
      drawAvatar(p.x, p.y, p.name, false);
    }

    // Draw My Player Avatar (Bottom Middle First-Person View)
    drawAvatar(myState.x, myState.targetY, myName + " (You)", true);

    // Update Firebase
    if (playerRef) {
      playerRef.set({
        name: myName,
        x: myState.x,
        y: myState.targetY,
        score: myState.score,
        prizes: myState.prizes,
        updated: Date.now()
      });
    }

    requestAnimationFrame(gameLoop);
  }

  // Avatar Drawer
  function drawAvatar(x, y, nameStr, isMe) {
    ctx.save();
    
    // Player Glow Base
    ctx.beginPath();
    ctx.arc(x, y + 10, 30, 0, Math.PI * 2);
    ctx.fillStyle = isMe ? 'rgba(56, 189, 248, 0.4)' : 'rgba(250, 204, 21, 0.4)';
    ctx.fill();

    // Body
    ctx.fillStyle = isMe ? '#0284c7' : '#eab308';
    ctx.fillRect(x - 20, y - 30, 40, 40);

    // Head
    ctx.beginPath();
    ctx.arc(x, y - 45, 18, 0, Math.PI * 2);
    ctx.fillStyle = '#fde047';
    ctx.fill();

    // Name Tag
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(nameStr, x, y - 70);

    ctx.restore();
  }

  // --- SAVE SCORE TO GOOGLE SHEET ---
  function saveScoreToGoogleSheet(resultStatus) {
    if (!GOOGLE_SHEET_SCRIPT_URL || GOOGLE_SHEET_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;

    fetch(GOOGLE_SHEET_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        playerName: myName,
        score: myState.score,
        prizes: myState.prizes,
        result: resultStatus
      })
    }).catch(err => console.error("Sheet Sync Error:", err));
  }
</script>
</body>
</html>
