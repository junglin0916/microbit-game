<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: Scout Expedition & Combat</title>
  
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Firebase Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* HUD */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      min-width: 250px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    .hud-title { font-weight: 700; color: #38bdf8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    .bar-container { width: 100%; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }
    #hp-bar { height: 100%; background: #22c55e; width: 100%; transition: width 0.2s ease, background 0.2s; }

    .btn-action {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #0369a1; }

    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .indicator.online { background: #22c55e; box-shadow: 0 0 12px #22c55e; }

    /* YouTube Picture-in-Picture Mood Player */
    #yt-mood-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 280px;
      height: 158px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      background: #000;
    }
    #yt-mood-container iframe { width: 100%; height: 100%; border: none; }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- HUD -->
<div class="hud-panel">
  <div class="hud-title" id="player-id-tag">Player: Scout #1</div>
  <div class="hud-title">Health</div>
  <div class="bar-container"><div id="hp-bar"></div></div>
  
  <div style="margin-top: 8px;">
    <button class="btn-action" onclick="connectMicrobit()">⚔️ Connect Micro:bit</button>
  </div>
  <div id="bit-status" style="font-size: 11px; color: #94a3b8; margin-top: 6px;">Micro:bit: Optional (WASD + Space ready)</div>
</div>

<!-- Multiplayer Status Badge -->
<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Connecting to server...</span>
</div>

<!-- Mood Stream YouTube Video -->
<div id="yt-mood-container">
  <iframe 
    src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1&controls=1&enablejsapi=1" 
    allow="autoplay; encrypted-media">
  </iframe>
</div>

<div class="controls-hint">
  <b>[WASD]</b> Walk Ground &nbsp;|&nbsp; <b>[SPACE]</b> Sword Slash &nbsp;|&nbsp; <b>[SWING MICRO:BIT]</b> Motion Slash
</div>

<script>
  // --- 1. FIREBASE SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  const myRandomNumber = Math.floor(Math.random() * 899 + 100);
  const myName = "Scout #" + myRandomNumber;
  document.getElementById('player-id-tag').textContent = `You: ${myName}`;

  const playerId = 'scout_' + Math.floor(Math.random() * 100000);
  let db, playerRef, playersRef;
  let peerPlayers = {}, peerMeshes = {};

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    playersRef = db.ref('earth_expedition_3d/players');
    playerRef = db.ref(`earth_expedition_3d/players/${playerId}`);
    playerRef.onDisconnect().remove();

    playersRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      peerPlayers = {};
      let count = 0;
      for (let id in data) {
        if (id !== playerId) {
          peerPlayers[id] = data[id];
          count++;
        }
      }
      document.getElementById('net-status').className = count > 0 ? 'indicator online' : 'indicator';
      document.getElementById('net-text').textContent = count > 0 ? `Co-Op Connected (${count + 1} Explorers)` : `Waiting for Player 2...`;
      syncPeerModels();
    });
  } catch(e) { console.error("Firebase fail:", e); }

  // --- 2. THREE.JS 3D WORLD SETUP ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x38bdf8); // Bright Blue Sky

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // Sunlight & Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfff7ed, 0.9);
  sunLight.position.set(50, 100, 50);
  scene.add(sunLight);

  // Bright Green Terrain Ground
  const groundGeo = new THREE.PlaneGeometry(300, 300);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Mountain Props
  for (let i = 0; i < 12; i++) {
    const mGeo = new THREE.ConeGeometry(8 + Math.random()*8, 20 + Math.random()*20, 5);
    const mMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
    const mountain = new THREE.Mesh(mGeo, mMat);
    mountain.position.set((Math.random() - 0.5) * 200, 10, (Math.random() - 0.5) * 200);
    scene.add(mountain);
  }

  // Helper function to create Scout 3D Avatar
  function createScoutModel(colorHex) {
    const group = new THREE.Group();

    // Body
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.8, 0.8),
      new THREE.MeshLambertMaterial({ color: colorHex })
    );
    body.position.y = 0.9;
    group.add(body);

    // Head
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 12, 12),
      new THREE.MeshLambertMaterial({ color: 0xfde047 })
    );
    head.position.y = 2.1;
    group.add(head);

    return group;
  }

  // Create Local Player Avatar
  const playerColor = 0x0284c7;
  const myAvatar = createScoutModel(playerColor);
  scene.add(myAvatar);

  const playerState = { x: 0, z: 0, rotY: 0, hp: 100 };

  // --- 3. WEB AUDIO SOUND EFFECTS ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'slash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
  }

  // --- 4. MONSTER SYSTEM ---
  let activeMonster = null;
  function spawnMonster() {
    if (activeMonster) return;
    const mX = playerState.x + (Math.random() - 0.5) * 30;
    const mZ = playerState.z + (Math.random() - 0.5) * 30;

    const mMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.2, 8, 8),
      new THREE.MeshLambertMaterial({ color: 0xef4444 })
    );
    mMesh.position.set(mX, 1.2, mZ);
    scene.add(mMesh);

    activeMonster = { mesh: mMesh, x: mX, z: mZ };
  }
  setInterval(spawnMonster, 5000);

  function attackWithSword() {
    playSound('slash');
    if (activeMonster) {
      const dist = Math.hypot(playerState.x - activeMonster.x, playerState.z - activeMonster.z);
      if (dist < 6) {
        scene.remove(activeMonster.mesh);
        activeMonster = null;
        playSound('hit');
      }
    }
  }

  // --- 5. MICRO:BIT WEB BLUETOOTH ---
  async function connectMicrobit() {
    const statusDiv = document.getElementById('bit-status');
    try {
      statusDiv.textContent = "Searching for micro:bit...";
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: ['e95d0753-251d-470a-a062-fa1922dfa9a8']
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('e95d0753-251d-470a-a062-fa1922dfa9a8');
      const char = await service.getCharacteristic('e95dca4b-251d-470a-a062-fa1922dfa9a8');

      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', (e) => {
        const view = e.target.value;
        const x = view.getInt16(0, true);
        const y = view.getInt16(2, true);
        const z = view.getInt16(4, true);

        const accel = Math.sqrt(x*x + y*y + z*z);
        if (accel > 1800) attackWithSword();
      });

      statusDiv.style.color = "#22c55e";
      statusDiv.textContent = "Micro:bit Sword: CONNECTED";
    } catch (err) {
      statusDiv.style.color = "#f59e0b";
      statusDiv.textContent = "Keyboard mode active [SPACE to attack]";
    }
  }

  // --- 6. MULTIPLAYER PEER SYNC ---
  function syncPeerModels() {
    for (let id in peerPlayers) {
      const p = peerPlayers[id];
      if (!peerMeshes[id]) {
        const pModel = createScoutModel(0xeab308);
        scene.add(pModel);
        peerMeshes[id] = pModel;
      }
      peerMeshes[id].position.set(p.x, 0, p.z);
      peerMeshes[id].rotation.y = p.rotY || 0;
    }

    for (let id in peerMeshes) {
      if (!peerPlayers[id]) {
        scene.remove(peerMeshes[id]);
        delete peerMeshes[id];
      }
    }
  }

  // --- 7. INPUTS & MAIN GAME LOOP ---
  const keys = { w: false, a: false, s: false, d: false };
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = true;
    if (k === 's') keys.s = true;
    if (k === 'a') keys.a = true;
    if (k === 'd') keys.d = true;
    if (e.key === ' ') attackWithSword();
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'w') keys.w = false;
    if (k === 's') keys.s = false;
    if (k === 'a') keys.a = false;
    if (k === 'd') keys.d = false;
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const moveSpeed = 12 * delta;

    if (keys.w) playerState.z -= moveSpeed;
    if (keys.s) playerState.z += moveSpeed;
    if (keys.a) playerState.x -= moveSpeed;
    if (keys.d) playerState.x += moveSpeed;

    myAvatar.position.set(playerState.x, 0, playerState.z);

    // Smooth Camera Follow
    camera.position.set(playerState.x, 10, playerState.z + 18);
    camera.lookAt(playerState.x, 2, playerState.z);

    // Monster hit detection
    if (activeMonster) {
      const dist = Math.hypot(playerState.x - activeMonster.x, playerState.z - activeMonster.z);
      if (dist < 2) {
        playerState.hp = Math.max(0, playerState.hp - 10 * delta);
        const hpBar = document.getElementById('hp-bar');
        hpBar.style.width = playerState.hp + '%';
        if (playerState.hp < 30) hpBar.style.background = '#ef4444';
      }
    }

    // Sync to Firebase
    if (playerRef) {
      playerRef.set({
        name: myName,
        x: playerState.x,
        z: playerState.z,
        rotY: playerState.rotY,
        hp: playerState.hp,
        updated: Date.now()
      });
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
