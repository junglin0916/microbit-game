<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: Scout Expedition Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f141d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid #3a475a;
    }
    canvas { background: #1a222d; display: block; }
    
    /* HUD Overlays */
    .hud-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(15, 20, 29, 0.85);
      padding: 12px 18px;
      border-radius: 6px;
      border: 1px solid #4a5a70;
      pointer-events: none;
    }
    .hud-title { font-weight: bold; color: #4db8ff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
    .bar-container { width: 180px; height: 14px; background: #222; border-radius: 7px; overflow: hidden; margin-bottom: 8px; border: 1px solid #444; }
    .bar-fill { height: 100%; transition: width 0.1s linear; }
    #stamina-bar { background: linear-gradient(90deg, #e67e22, #2ecc71); width: 100%; }
    
    .status-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(15, 20, 29, 0.85);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #4a5a70;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; }
    .indicator.online { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }

    .controls-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 29, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #aaa;
      border: 1px solid #3a475a;
      pointer-events: none;
    }
  </style>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  
  <div class="hud-panel">
    <div class="hud-title">Scout Stamina</div>
    <div class="bar-container">
      <div id="stamina-bar" class="bar-fill"></div>
    </div>
    <div class="hud-title" id="biome-label">Biome: The Shore</div>
    <div style="font-size: 14px; color: #f39c12;" id="alt-label">Altitude: 0m</div>
  </div>

  <div class="status-badge">
    <div id="net-status" class="indicator"></div>
    <span id="net-text">Solo Explorer</span>
  </div>

  <div class="controls-hint">
    [WASD / Arrow Keys] Move/Climb | [SHIFT] Lunge | [SPACE] Drop Rope/Anchor | [Micro:bit Tilt Supported]
  </div>
</div>

<script>
  // --- 1. FIREBASE INITIALIZATION ---
  // Replace this config with your Firebase credentials!
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  let db = null;
  let playerRef = null;
  let playersRef = null;

  // Generate unique ID for session
  const playerId = 'scout_' + Math.floor(Math.random() * 10000);
  let otherPlayers = {};

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    playersRef = db.ref('peak_expedition/players');
    playerRef = db.ref(`peak_expedition/players/${playerId}`);

    // Disconnect cleanup
    playerRef.onDisconnect().remove();

    // Listen for other players
    playersRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      otherPlayers = {};
      let peerCount = 0;
      
      for (let id in data) {
        if (id !== playerId) {
          otherPlayers[id] = data[id];
          peerCount++;
        }
      }

      const indicator = document.getElementById('net-status');
      const text = document.getElementById('net-text');
      if (peerCount > 0) {
        indicator.classList.add('online');
        text.textContent = `Co-Op Linked (${peerCount + 1} Scouts)`;
      } else {
        indicator.classList.remove('online');
        text.textContent = `Solo Explorer`;
      }
    });
  } catch (e) {
    console.warn("Firebase not configured or failed to connect. Running offline mode.", e);
  }

  // --- 2. GAME ENGINE & CANVAS SETUP ---
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Input States
  const keys = { Up: false, Down: false, Left: false, Right: false, Lunge: false, Action: false };

  window.addEventListener('keydown', e => handleKey(e, true));
  window.addEventListener('keyup', e => handleKey(e, false));

  function handleKey(e, isPressed) {
    if (['ArrowUp', 'KeyW'].includes(e.code)) keys.Up = isPressed;
    if (['ArrowDown', 'KeyS'].includes(e.code)) keys.Down = isPressed;
    if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.Left = isPressed;
    if (['ArrowRight', 'KeyD'].includes(e.code)) keys.Right = isPressed;
    if (['ShiftLeft', 'ShiftRight'].includes(e.code)) keys.Lunge = isPressed;
    if (['Space'].includes(e.code)) keys.Action = isPressed;
  }

  // --- 3. GAME WORLD & PLAYER STATE ---
  const player = {
    x: 400,
    y: 500,
    vx: 0,
    vy: 0,
    radius: 14,
    stamina: 100,
    maxStamina: 100,
    isClimbing: false,
    hasRopeDeployed: false,
    ropeY: 0,
    color: '#' + Math.floor(Math.random()*16777215).toString(16)
  };

  let cameraY = 0;
  let worldAltitude = 0;

  // Procedural Rock Wall Ledges & Hold Points
  const ledges = [];
  function generateTerrain() {
    for (let y = 600; y > -10000; y -= 60 + Math.random() * 40) {
      const width = 80 + Math.random() * 120;
      const x = Math.random() * (canvas.width - width);
      ledges.push({ x, y, w: width, h: 16 });
    }
  }
  generateTerrain();

  // Biome Themes
  function getBiome(alt) {
    if (alt < 1500) return { name: "The Shore", bg: "#1a222d", rock: "#4a5a70" };
    if (alt < 4000) return { name: "Alpine Crags", bg: "#0f1b29", rock: "#7f8c8d" };
    if (alt < 7000) return { name: "The Caldera", bg: "#2c1108", rock: "#e67e22" };
    return { name: "Volcanic Peak", bg: "#1a0000", rock: "#e74c3c" };
  }

  // --- 4. GAME LOOP & PHYSICS ---
  let lastTime = performance.now();

  function update(dt) {
    // Movement Physics
    const speed = 2.5;
    let moving = false;

    // Check if touching any ledge
    player.isClimbing = false;
    for (let ledge of ledges) {
      if (
        player.x + player.radius > ledge.x &&
        player.x - player.radius < ledge.x + ledge.w &&
        player.y + player.radius >= ledge.y &&
        player.y - player.radius <= ledge.y + ledge.h
      ) {
        player.isClimbing = true;
        break;
      }
    }

    // Controls & Stamina Logic
    if (player.stamina > 0) {
      if (keys.Up) { player.y -= speed; moving = true; }
      if (keys.Down) { player.y += speed; moving = true; }
      if (keys.Left) { player.x -= speed; moving = true; }
      if (keys.Right) { player.x += speed; moving = true; }

      // Shift Lunge
      if (keys.Lunge && moving) {
        player.y -= speed * 1.8;
        player.stamina -= 0.8;
      }

      // Stamina drain/recovery
      if (moving && player.isClimbing) {
        player.stamina = Math.max(0, player.stamina - 0.15);
      } else if (!moving) {
        player.stamina = Math.min(player.maxStamina, player.stamina + 0.3); // Rest to recover
      }
    } else {
      // Exhausted / Falling
      player.isClimbing = false;
      player.y += 5; // Gravity pull
      player.stamina = Math.min(player.maxStamina, player.stamina + 0.05); // Slow recovery on fall
    }

    // Deploy Rope Action
    if (keys.Action && !player.hasRopeDeployed) {
      player.hasRopeDeployed = true;
      player.ropeY = player.y;
    }

    // Boundary constraints
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));

    // Camera follow (Smooth vertical tracking)
    const targetCamY = player.y - 400;
    cameraY += (targetCamY - cameraY) * 0.1;

    // Altitude calculation
    worldAltitude = Math.max(0, Math.floor((500 - player.y)));

    // Sync to Firebase
    if (playerRef) {
      playerRef.set({
        x: player.x,
        y: player.y,
        stamina: player.stamina,
        color: player.color,
        hasRope: player.hasRopeDeployed,
        ropeY: player.ropeY,
        updated: Date.now()
      });
    }

    // UI Updates
    document.getElementById('stamina-bar').style.width = `${(player.stamina / player.maxStamina) * 100}%`;
    document.getElementById('alt-label').textContent = `Altitude: ${worldAltitude}m`;
    const biome = getBiome(worldAltitude);
    document.getElementById('biome-label').textContent = `Biome: ${biome.name}`;
  }

  // --- 5. RENDER SYSTEM ---
  function render() {
    const biome = getBiome(worldAltitude);
    ctx.fillStyle = biome.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    // Draw Ledges / Climbing Holds
    ctx.fillStyle = biome.rock;
    for (let ledge of ledges) {
      if (ledge.y > cameraY - 50 && ledge.y < cameraY + canvas.height + 50) {
        ctx.beginPath();
        ctx.roundRect(ledge.x, ledge.y, ledge.w, ledge.h, 6);
        ctx.fill();
      }
    }

    // Draw Deployed Co-op Ropes
    if (player.hasRopeDeployed) {
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(player.x, player.ropeY);
      ctx.lineTo(player.x, player.ropeY + 300);
      ctx.stroke();
    }

    // Draw Other Online Players
    for (let id in otherPlayers) {
      const p = otherPlayers[id];
      if (p.hasRope) {
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.ropeY);
        ctx.lineTo(p.x, p.ropeY + 300);
        ctx.stroke();
      }

      ctx.fillStyle = p.color || '#e74c3c';
      ctx.beginPath();
      ctx.arc(p.x, p.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Peer label
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.fillText("Scout", p.x - 12, p.y - 18);
    }

    // Draw Local Player
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = player.isClimbing ? '#2ecc71' : '#ffffff';
    ctx.stroke();

    ctx.restore();
  }

  function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
