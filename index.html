<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emotion Dance APICTA Multi-View</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a12; font-family:'Segoe UI', sans-serif; overflow:hidden; color:#fff; }
  
  /* GRID LAYOUT FOR REAL-TIME MULTI-VIEW */
  #arena-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Split screen 2-player view */
    width: 100vw;
    height: 100vh;
    gap: 8px;
    padding: 8px;
    background: #111;
  }

  .player-card {
    position: relative;
    border: 2px solid #534AB7;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .player-card.active-me {
    border-color: #6BCB77;
    box-shadow: 0 0 15px rgba(107, 203, 119, 0.4);
  }

  .player-header {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 8px;
  }

  .dance-pad-display {
    font-size: 80px;
    margin-top: 20px;
    transition: transform 0.1s ease;
  }

  .status-badge {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(0,0,0,0.85);
    border: 1px solid #6BCB77;
    color: #6BCB77;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="status-bar" class="status-badge">⚡ Realtime Multiplayer Grid Active</div>

<!-- 2-PLAYER SPLIT SCREEN ARENA -->
<div id="arena-grid">
  <!-- PLAYER 1 (YOU) -->
  <div class="player-card active-me" id="card-me">
    <div class="player-header">
      <span id="my-name">Player 1 ( You )</span>
      <span id="my-score">Score: 0</span>
    </div>
    <div class="dance-pad-display" id="my-pad">😐</div>
    <p style="margin-top:10px; color:#aaa;">Press [W, A, S, D] to Dance</p>
  </div>

  <!-- PLAYER 2 (REMOTE OPPONENT) -->
  <div class="player-card" id="card-opp">
    <div class="player-header">
      <span id="opp-name">Waiting for Player 2...</span>
      <span id="opp-score">Score: 0</span>
    </div>
    <div class="dance-pad-display" id="opp-pad">⏳</div>
    <p style="margin-top:10px; color:#aaa;" id="opp-status">Waiting for real-time connection...</p>
  </div>
</div>

<script>
// 1. FIXED FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const myId = "player_" + Math.floor(Math.random() * 8999 + 1000);
const myName = prompt("Enter your Name for the Live Multi-View Grid:", "Player " + myId.slice(-3));
document.getElementById('my-name').textContent = myName + " (You)";

const EMOJIS = {
  w: "😄 Happy",
  a: "😡 Angry",
  s: "😢 Sad",
  d: "🧘 Calm",
  none: "😐 Neutral"
};

let myScore = 0;

// 2. BROADCAST MY REALTIME DANCE MOVES TO FIREBASE
function sendMove(key) {
  database.ref('live_arena/' + myId).set({
    name: myName,
    key: key,
    score: myScore,
    lastActive: Date.now()
  });
}

// 3. LISTEN TO ALL OTHER PLAYERS IN REALTIME
database.ref('live_arena').on('value', (snapshot) => {
  const players = snapshot.val() || {};
  
  for (let id in players) {
    if (id !== myId) {
      const opp = players[id];
      
      // Update Player 2 Split View live!
      document.getElementById('opp-name').textContent = opp.name;
      document.getElementById('opp-score').textContent = "Score: " + opp.score;
      document.getElementById('opp-pad').textContent = EMOJIS[opp.key] || "😐 Neutral";
      document.getElementById('opp-status').textContent = "⚡ Realtime Sync Active";
    }
  }
});

// 4. KEYBOARD LISTENERS
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d'].includes(k)) {
    myScore += 10;
    document.getElementById('my-score').textContent = "Score: " + myScore;
    document.getElementById('my-pad').textContent = EMOJIS[k];
    sendMove(k);
  }
});

document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d'].includes(k)) {
    document.getElementById('my-pad').textContent = "😐 Neutral";
    sendMove('none');
  }
});

// Register initial presence
sendMove('none');
</script>
</body>
</html>
