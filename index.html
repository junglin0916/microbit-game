<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAK: Interactive DDR Shopping Paradise</title>
  
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Canvas Confetti FX -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #020617; color: #fff; }
    
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* HUD Header */
    .hud-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.92);
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      z-index: 100;
      min-width: 280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    
    .hud-title { font-weight: 800; color: #38bdf8; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }

    .btn-action {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      transition: transform 0.1s;
    }
    .btn-action:active { transform: scale(0.96); }

    .status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.92);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .indicator { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .indicator.online { background: #22c55e; box-shadow: 0 0 12px #22c55e; }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 13px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Shopping Popup Toast */
    #shop-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      padding: 24px 36px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      text-align: center;
      z-index: 200;
      transition: transform 0.2s ease;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.5);
    }
    #shop-toast.show { transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- HUD -->
<div class="hud-panel">
  <div class="hud-title" id="player-id-tag">You: Scout</div>
  <div>
    <button class="btn-action" onclick="connectMicrobit()">📲 Connect Micro:bit (Hand Shake / Wave)</button>
  </div>
  <div id="bit-status" style="font-size: 11px; color: #94a3b8; margin-top: 6px;">DDR Dance Pad / Keyboard Active</div>
</div>

<!-- Connection Badge -->
<div class="status-badge">
  <div id="net-status" class="indicator"></div>
  <span id="net-text">Connecting to server...</span>
</div>

<div id="shop-toast">🛍️ Welcome to Boutique Arcade!</div>

<div class="controls-hint">
  <b>[DDR STEP PAD / ARROWS / WASD]</b> Walk Boulevard &nbsp;|&nbsp; <b>[SWING MICRO:BIT / SPACE]</b> Interact / Buy
</div>

<script>
  // --- 1. SOUND EFFECT GENERATOR (WEB AUDIO API) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSFX(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'buy') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    }
  }

  // --- 2. FIREBASE MULTIPLAYER SYNC ---
  const firebaseConfig = {
    apiKey: "AIzaSyBT06UhmGbTP_8G4Sjr41G8b0H4dKVCjy8",
    authDomain: "emotion-dance-battle.firebaseapp.com",
    databaseURL: "https://emotion-dance-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "emotion-dance-battle",
    storageBucket: "emotion-dance-battle.firebasestorage.app",
    messagingSenderId: "47052488466",
    appId: "1:47052488466:web:2fac8b10617898aac3fdcb"
  };

  const myRandomNumber = Math.floor(Math.random() * 899 + 100);
  const myName = "Scout #" + myRandomNumber;
  document.getElementById('player-id-tag').textContent = `You: ${myName}`;

  const playerId = 'scout_' + Math.floor(Math.random() * 100000);
  let db, playerRef, playersRef;
  let peerPlayers = {}, peerMeshes = {};

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    playersRef = db.ref('ddr_arcade_street/players');
    playerRef = db.ref(`ddr_arcade_street/players/${playerId}`);
    playerRef.onDisconnect().remove();

    playersRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      peerPlayers = {};
      let count = 0;
      for (let id in data) {
        if (id !== playerId) {
          peerPlayers[id] = data[id];
          count++;
        }
      }
      document.getElementById('net-status').className = count > 0 ? 'indicator online' : 'indicator';
      document.getElementById('net-text').textContent = count > 0 ? `Co-Op Shopping (${count + 1} Explorers)` : `Waiting for Player 2...`;
      syncPeerModels();
    });
  } catch(e) { console.error("Firebase err:", e); }

  // --- 3. THREE.JS SCENE SETUP ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const streetLight = new THREE.DirectionalLight(0xfef08a, 0.8);
  streetLight.position.set(0, 30, 20);
  scene.add(streetLight);

  // Pavement Promenade Ground
  const floorGeo = new THREE.PlaneGeometry(50, 300);
  const floorMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Decorative Street Tiles
  const stripeGeo = new THREE.PlaneGeometry(2, 300);
  const stripeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
  const stripe = new THREE.Mesh(stripeGeo, stripeMat);
  stripe.rotation.x = -Math.PI / 2;
  stripe.position.y = 0.01;
  scene.add(stripe);

  // Generate Lifelike Shopping Boutiques
  const shops = [
    { name: "👗 Fashion Hub", color: 0xec4899 },
    { name: "👟 Sneaker World", color: 0x3b82f6 },
    { name: "☕ Cyber Cafe", color: 0xf59e0b },
    { name: "🎮 Arcade Zone", color: 0x8b5cf6 },
    { name: "📱 Tech Store", color: 0x10b981 },
    { name: "🍕 Pizza Palace", color: 0xef4444 }
  ];

  for (let z = -100, i = 0; z <= 100; z += 35, i++) {
    const shop = shops[i % shops.length];
    createStorefront(-16, z, shop.color, shop.name, "LEFT");
    createStorefront(16, z, shops[(i+1)%shops.length].color, shops[(i+1)%shops.length].name, "RIGHT");
  }

  function createStorefront(x, z, colorHex, nameStr, side) {
    const group = new THREE.Group();

    // Store Exterior Building
    const bldg = new THREE.Mesh(
      new THREE.BoxGeometry(14, 12, 22),
      new THREE.MeshLambertMaterial({ color: 0x1e293b })
    );
    bldg.position.set(x, 6, z);
    group.add(bldg);

    // Glowing Store Window Billboard
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 4),
      new THREE.MeshBasicMaterial({ color: colorHex })
    );
    sign.position.set(side === "LEFT" ? x + 7.1 : x - 7.1, 10, z);
    sign.rotation.y = side === "LEFT" ? Math.PI / 2 : -Math.PI / 2;
    group.add(sign);

    scene.add(group);
  }

  // --- 4. AVATAR CREATION ---
  function createScoutModel(colorHex) {
    const group = new THREE.Group();

    // Body
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.8, 0.8),
      new THREE.MeshLambertMaterial({ color: colorHex })
    );
    body.position.y = 0.9;
    group.add(body);

    // Head
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 12, 12),
      new THREE.MeshLambertMaterial({ color: 0xfde047 })
    );
    head.position.y = 2.1;
    group.add(head);

    return group;
  }

  const myAvatar = createScoutModel(0x0284c7);
  scene.add(myAvatar);

  const playerState = { x: 0, z: 80, rotY: 0 };

  // --- 5. ACTION TRIGGER (MICRO:BIT & KEYBOARD) ---
  function triggerShoppingAction() {
    playSFX('buy');
    confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });

    const toast = document.getElementById('shop-toast');
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 1500);

    // Jump animation
    myAvatar.position.y = 1.2;
    setTimeout(() => { myAvatar.position.y = 0; }, 250);
  }

  async function connectMicrobit() {
    const statusDiv = document.getElementById('bit-status');
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: ['e95d0753-251d-470a-a062-fa1922dfa9a8']
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('e95d0753-251d-470a-a062-fa1922dfa9a8');
      const char = await service.getCharacteristic('e95dca4b-251d-470a-a062-fa1922dfa9a8');

      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', (e) => {
        const view = e.target.value;
        const x = view.getInt16(0, true);
        const y = view.getInt16(2, true);
        const z = view.getInt16(4, true);

        if (Math.abs(x) > 1600 || Math.abs(y) > 1600) {
          triggerShoppingAction();
        }
      });

      statusDiv.style.color = "#22c55e";
      statusDiv.textContent = "Micro:bit Motion CONNECTED";
    } catch (err) {
      statusDiv.style.color = "#f59e0b";
      statusDiv.textContent = "DDR Pad / Keyboard Ready";
    }
  }

  // --- 6. MULTIPLAYER PEER SYNC ---
  function syncPeerModels() {
    for (let id in peerPlayers) {
      const p = peerPlayers[id];
      if (!peerMeshes[id]) {
        const pModel = createScoutModel(0xeab308);
        scene.add(pModel);
        peerMeshes[id] = pModel;
      }
      peerMeshes[id].position.set(p.x, p.y || 0, p.z);
      peerMeshes[id].rotation.y = p.rotY || 0;
    }

    for (let id in peerMeshes) {
      if (!peerPlayers[id]) {
        scene.remove(peerMeshes[id]);
        delete peerMeshes[id];
      }
    }
  }

  // --- 7. INPUTS & GAME LOOP ---
  const keys = { w: false, a: false, s: false, d: false };
  let stepTimer = 0;

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
    if (k === 's' || e.key === 'ArrowDown') keys.s = true;
    if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
    if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
    if (e.key === ' ') triggerShoppingAction();
  });

  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
    if (k === 's' || e.key === 'ArrowDown') keys.s = false;
    if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
    if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const moveSpeed = 12 * delta;
    const turnSpeed = 2.5 * delta;

    let isMoving = false;

    if (keys.a) { playerState.rotY += turnSpeed; isMoving = true; }
    if (keys.d) { playerState.rotY -= turnSpeed; isMoving = true; }

    if (keys.w) {
      playerState.x -= Math.sin(playerState.rotY) * moveSpeed;
      playerState.z -= Math.cos(playerState.rotY) * moveSpeed;
      isMoving = true;
    }
    if (keys.s) {
      playerState.x += Math.sin(playerState.rotY) * moveSpeed;
      playerState.z += Math.cos(playerState.rotY) * moveSpeed;
      isMoving = true;
    }

    if (isMoving) {
      stepTimer += delta;
      if (stepTimer > 0.3) {
        playSFX('step');
        stepTimer = 0;
      }
    }

    playerState.x = Math.max(-10, Math.min(10, playerState.x));
    playerState.z = Math.max(-110, Math.min(110, playerState.z));

    myAvatar.position.x = playerState.x;
    myAvatar.position.z = playerState.z;
    myAvatar.rotation.y = playerState.rotY;

    // Smooth Third-Person Camera
    camera.position.x = playerState.x + Math.sin(playerState.rotY) * 12;
    camera.position.z = playerState.z + Math.cos(playerState.rotY) * 12;
    camera.position.y = 6;
    camera.lookAt(playerState.x, 2, playerState.z);

    if (playerRef) {
      playerRef.set({
        name: myName,
        x: playerState.x,
        y: myAvatar.position.y,
        z: playerState.z,
        rotY: playerState.rotY,
        updated: Date.now()
      });
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
